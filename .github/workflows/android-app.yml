name: Android-app bouwen

on:
  push:
    branches: [main]
    paths: ["index.html", "app/**", "food/**", "ex/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web-app klaarzetten
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node copy-web.js
          npx cap sync android
      - name: APK bouwen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Loopa.apk
      - name: Downloadlink bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest Loopa.apk \
            --title "Loopa app (Android)" \
            --notes "Nieuwste Android-versie van Loopa, gebouwd op $(date -u '+%d-%m-%Y %H:%M') UTC. Open deze pagina op je Android-telefoon, tik op Loopa.apk en installeer." \
            --target "${GITHUB_SHA}"

  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-app klaarzetten
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node copy-web.js
          npx cap sync ios
      - name: iPhone-app proefbouwen (zonder ondertekening)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
          exit ${PIPESTATUS[0]}
