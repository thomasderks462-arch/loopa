name: Etensfoto's ophalen
on:
  push:
    paths: ["tools/foodtitles.json", "tools/fetch_food.py", ".github/workflows/food-photos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_food.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add food
          git commit -m "Etensfoto's bijgewerkt" || echo "niets nieuw"
          git push
